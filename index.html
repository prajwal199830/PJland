
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rise2King — Games</title>
  <meta name="description" content="Choose a game and start playing on Rise2King.">
  <meta name="theme-color" content="#080705">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 0 22px;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(
        ellipse at 50% 0%,
        #2b1e0d 0%,
        #100c07 42%,
        #050403 100%
      );
    }

    .wrap {
      width: min(1080px, 100%);
      margin: 0 auto;
    }

    header {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(213, 174, 96, .2);
    }

    .logo {
      color: #e4c77f;
      font: bold 27px Georgia, serif;
      letter-spacing: 2px;
    }

    .logo span {
      color: #fff;
    }

    .crown {
      margin-right: 9px;
    }

    .header-note {
      color: #9c8b6e;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .intro {
      text-align: center;
      padding: 65px 10px 42px;
    }

    .intro .eyebrow {
      color: #a9874d;
      font-size: 11px;
      letter-spacing: 5px;
      margin-bottom: 15px;
    }

    h1 {
      color: #e7cb87;
      font: bold clamp(36px, 6vw, 58px) Georgia, serif;
    }

    .intro p {
      color: #bdb09a;
      font: 15px/1.8 Georgia, serif;
      margin: 14px auto 0;
      max-width: 550px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      padding-bottom: 70px;
    }

    .game-card {
      min-height: 220px;
      padding: 25px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid rgba(203, 162, 83, .3);
      border-radius: 13px;
      background: linear-gradient(
        145deg,
        rgba(37, 27, 14, .96),
        rgba(13, 10, 7, .98)
      );
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    .game-card.featured {
      border-color: rgba(226, 190, 113, .75);
      background: linear-gradient(145deg, #3b2a13, #171108 78%);
    }

    .game-icon {
      font-size: 43px;
      margin-bottom: 17px;
    }

    .game-card h2 {
      color: #e7cc91;
      font: bold 22px Georgia, serif;
    }

    .game-card p {
      color: #a99b83;
      font: 13px/1.6 Georgia, serif;
      margin-top: 10px;
    }

    .play {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 19px;
      border: 1px solid #c49a4e;
      border-radius: 6px;
      background: #8b642b;
      color: #fff4d9;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-decoration: none;
      transition: .2s;
    }

    .play:hover {
      background: #ad813b;
      transform: translateY(-2px);
    }

    .loading {
      color: #c39c5a;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .loading:after {
      content: "";
      animation: dots 1.3s steps(4,end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }

    footer {
      border-top: 1px solid rgba(213,174,96,.16);
      padding: 22px 0;
      color: #766a56;
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 760px) {
      .games {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 500px) {
      body {
        padding: 0 14px;
      }

      header {
        height: 70px;
      }

      .logo {
        font-size: 22px;
      }

      .header-note {
        font-size: 9px;
        letter-spacing: 1px;
      }

      .intro {
        padding: 52px 5px 32px;
      }

      .games {
        gap: 12px;
      }

      .game-card {
        min-height: 185px;
        padding: 18px 12px;
      }

      .game-card h2 {
        font-size: 18px;
      }

      .game-icon {
        font-size: 35px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <div class="logo">
        <span class="crown">👑</span>RISE<span>2</span>KING
      </div>

      <div class="header-note">
        Enter the world of games
      </div>
    </header>

    <main>
      <section class="intro">
        <div class="eyebrow">WELCOME TO RISE2KING</div>
        <h1>Choose Your Game</h1>
        <p>Pick a game and begin your adventure.</p>
      </section>

      <section class="games" aria-label="Games">

        <article class="game-card featured">
          <div class="game-icon">⚔️</div>
          <h2>Conquer PJLand</h2>
          <p>Your journey to the kingdom starts here.</p>
          <a class="play" href="level0.html">
            PLAY NOW&nbsp; →
          </a>
        </article>

        <article class="game-card">
          <div class="game-icon">🎮</div>
          <div class="loading" href="the_king_s_hunt (1).html">The Kings Hunt</div>
        </article>

        <article class="game-card">
          <div class="game-icon">🎮</div>
          <div class="loading">Loading</div>
        </article>

        <article class="game-card">
          <div class="game-icon">🎮</div>
          <div class="loading">Loading</div>
        </article>

        <article class="game-card">
          <div class="game-icon">🎮</div>
          <div class="loading">Loading</div>
        </article>

        <article class="game-card">
          <div class="game-icon">🎮</div>
          <div class="loading">Loading</div>
        </article>

      </section>
    </main>

    <footer>
      © <span id="year"></span> Rise2King
    </footer>

  </div>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
