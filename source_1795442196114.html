.transition{

.transition-all{

  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;

:root{
  --bg:#0d0c0a;
  --surface:#1a1814;
  --surface-2:#25221d;
  --stone:#8a8173;
  --stone-light:#c2b8a3;
  --gold:#d4af37;
  --gold-bright:#ffdf6b;
  --gold-dark:#8c6d1f;
  --crimson:#7a1a1a;
  --parchment:#f5efe0;
  --parchment-dark:#e8dfc8;
  --moss:#5a6b4a;
  --shadow:0 12px 40px rgba(0,0,0,.6);
  --border:rgba(212,175,55,.18);
  --border-strong:rgba(212,175,55,.35);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0c0a;
    --surface:#1a1814;
  }
}

* {
  font-variant-ligatures: common-ligatures;
}

html,body {
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--parchment);
  overflow-x:clip;
}

body {
  font-family:"EB Garamond", Georgia, serif;
}

.cinzel {
  font-family:"Cinzel", serif;
}

.cinzel-dec {
  font-family:"Cinzel Decorative", serif;
}

/* Custom scroll */

::-webkit-scrollbar {
  width:8px;
  height:8px;
}

::-webkit-scrollbar-thumb {
  background:var(--gold-dark);
  border-radius:8px;
}

::-webkit-scrollbar-track {
  background:var(--surface);
}

/* Hide outline for game */

canvas:focus {
  outline:none;
}

.hover\:border-\[var\(--border-strong\)\]:hover{
  border-color: var(--border-strong);
}

.hover\:bg-\[var\(--gold-bright\)\]:hover{
  background-color: var(--gold-bright);
}

.hover\:bg-white\/15:hover{
  background-color: rgb(255 255 255 / 0.15);
}

.hover\:bg-white\/20:hover{
  background-color: rgb(255 255 255 / 0.2);
}

.hover\:bg-white\/\[0\.03\]:hover{
  background-color: rgb(255 255 255 / 0.03);
}

.hover\:bg-white\/\[0\.08\]:hover{
  background-color: rgb(255 255 255 / 0.08);
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.focus\:border-\[var\(--border-strong\)\]:focus{
  border-color: var(--border-strong);
}

.disabled\:opacity-30:disabled{
  opacity: 0.3;
}

@media (min-width: 640px){
  .sm\:h-\[56px\]{
    height: 56px;
  }

  .sm\:h-\[68vh\]{
    height: 68vh;
  }

  .sm\:w-\[56px\]{
    width: 56px;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:p-3{
    padding: 0.75rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:px-7{
    padding-left: 1.75rem;
    padding-right: 1.75rem;
  }

  .sm\:text-\[15px\]{
    font-size: 15px;
  }
}

@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }

  .md\:grid-cols-7{
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:h-\[calc\(100vh-76px\)\]{
    height: calc(100vh - 76px);
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1fr_300px\]{
    grid-template-columns: 1fr 300px;
  }

  .lg\:gap-3{
    gap: 0.75rem;
  }

  .lg\:rounded-\[14px\]{
    border-radius: 14px;
  }

  .lg\:border{
    border-width: 1px;
  }

  .lg\:p-0{
    padding: 0px;
  }

  .lg\:p-3{
    padding: 0.75rem;
  }
}
