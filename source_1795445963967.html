p with relief. Word spreads.",flavor:"Stomachs full, hearts fuller."},{id:"B",label:"Ration Strictly",desc:"Survive until spring",icon:"\uD83D\uDCCF",effects:{gold:-5,happiness:-10,fear:10},twist:"Order holds, but children stay thin.",flavor:"No feast, no famine."},{id:"C",label:"Import at Cost",desc:"Buy from Riverlands",icon:"\uD83D\uDEA2",effects:{happiness:18,gold:-50,reputation:12},twist:"Merchants respect your generosity.",flavor:"Expensive compassion."},{id:"D",label:"Pray & Fast",desc:"The gods will provide",icon:"\uD83D\uDE4F",effects:{happiness:-15,fear:5,loyalty:-5},twist:"Priests are annoyed you outsourced to gods.",flavor:"Faith is not edible."}]},{id:3,title:"Silks Want More",character:{name:"Lord Vane",role:"Noble Council",emoji:"\uD83C\uDFA9",color:"#5d3a9b"},dialogue:"The peasantry can bear 15% more tax. They breed quickly. We need new hunting lodges, Your Majesty.",context:"Nobles lobby for tax hike. Your gold coffers are listening.",choices:[{id:"A",label:"Approve Tax",desc:"Keep nobles happy",icon:"\uD83D\uDCB0",effects:{gold:45,happiness:-30,loyalty:10,fear:15},twist:"Nobles throw a party in your honor. Peasants don't attend.",flavor:"Gold now, pitchforks later."},{id:"B",label:"Flat Refuse",desc:"The people are not cattle",icon:"✊",effects:{happiness:20,loyalty:-15,gold:-10,reputation:15},twist:"Peasants chant your name. Nobles polish daggers.",flavor:"Populist king."},{id:"C",label:"Tax Luxuries Only",desc:"Tax silk, not bread",icon:"\uD83E\uDDF5",effects:{gold:15,happiness:5,reputation:10},twist:"Clever! Nobles annoyed but can't complain publicly.",flavor:"The accountant's dream."},{id:"D",label:"Tax the Taxmen",desc:"Audit the nobles",icon:"\uD83D\uDD0D",effects:{gold:25,loyalty:-20,fear:20,happiness:10},twist:"You find their hidden vaults. They find new grudges.",flavor:"Bold move."}]},{id:4,title:"Swords Want Coin",character:{name:"Captain Harg",role:"Army Commander",emoji:"\uD83E\uDE96",color:"#8b1a1a"},dialogue:"My boys haven't seen silver in two moons. Swords get dull when bellies are empty. You want loyalty? Pay for it.",context:"Army morale low. Desertion rumors.",choices:[{id:"A",label:"Double Pay",desc:"Buy loyalty",icon:"\uD83E\uDE99",effects:{army:25,loyalty:15,gold:-40},twist:"They cheer! Then immediately ask about retirement.",flavor:"Expensive but effective."},{id:"B",label:"Promises & Medals",desc:"Honor instead of gold",icon:"\uD83C\uDF96️",effects:{army:5,gold:-5,reputation:-5},twist:"Medals don't buy ale. They grumble.",flavor:"Pretty tin."},{id:"C",label:"Land Grants",desc:"Give frontier plots",icon:"\uD83D\uDDFA️",effects:{army:15,happiness:-10,gold:10},twist:"Farmers displaced, but soldiers settle.",flavor:"Swords into plowshares, forcibly."},{id:"D",label:"Let Them Loot",desc:"Bandits nearby...",icon:"⚔️",effects:{army:20,happiness:-20,fear:20,reputation:-15},twist:"Effective, and terrifying to everyone.",flavor:"Tyrant starter pack."}]},{id:5,title:"Smoke on Mount Kar",character:{name:"Scout Lina",role:"Dragon Watch",emoji:"\uD83D\uDC09",color:"#2a4a2a"},dialogue:"Sire! Black smoke, claw marks size of carts. Old Bren swears he saw wings. Dragon or very large goose?",context:"Dragon rumor. Panic spreads faster than fire.",choices:[{id:"A",label:"Send Knights",desc:"Face the beast",icon:"\uD83D\uDEE1️",effects:{reputation:25,army:-15,fear:-15,happiness:10},twist:"No dragon, just a forge fire. Knights embarrassed but celebrated.",flavor:"Heroic even when wrong."},{id:"B",label:"Evacuate & Tax",desc:"Dragon insurance fee",icon:"\uD83C\uDFC3",effects:{gold:20,happiness:-15,fear:15},twist:"People pay to not be eaten. Clever extortion.",flavor:"Capitalism, medieval edition."},{id:"C",label:"Hire Beast-Tamer",desc:"From PJ Land circus",icon:"\uD83C\uDFAA",effects:{gold:-25,reputation:15,happiness:10,army:5},twist:"The tamer befriends a lizard, not a dragon. Still impressive.",flavor:"Showmanship saves."},{id:"D",label:"Ignore It",desc:"Probably indigestion",icon:"\uD83D\uDE34",effects:{gold:5,fear:20,reputation:-10},twist:"It WAS a dragon. It left because bored. Lucky.",flavor:"Strategic ignorance."}]},{id:6,title:"Silk Road Proposal",character:{name:"Ambassador Zai",role:"Trader from Sunport",emoji:"\uD83E\uDDF3",color:"#c9a84c"},dialogue:"Great King, Sunport offers spice, silk, and stories. 20% tariff cut for exclusive passage. Your rivals will weep.",context:"Trade treaty from another country in PJ Land.",choices:[{id:"A",label:"Sign Exclusively",desc:"Rich but dependent",icon:"\uD83E\uDD1D",effects:{gold:50,reputation:-10,loyalty:-5},twist:"Gold flows, but other countries are jealous.",flavor:"Put all eggs, one basket."},{id:"B",label:"Open to All",desc:"Free market court",icon:"\uD83C\uDF10",effects:{gold:20,happiness:15,reputation:15},twist:"You become hub! Markets buzz.",flavor:"The merchant king."},{id:"C",label:"Demand More",desc:"60% for crown",icon:"⚖️",effects:{gold:-10,reputation:-15,fear:10},twist:"They walk away. Your advisor facepalms.",flavor:"Greed check failed."},{id:"D",label:"Build Your Own",desc:"PJ Royal Caravans",icon:"\uD83D\uDC2A",effects:{gold:-30,army:10,reputation:20,loyalty:10},twist:"Expensive startup, but long-term empire.",flavor:"Trade route DLC unlocked."}]},{id:7,title:"The Pale Cough",character:{name:"Sister Althea",role:"Healer",emoji:"⚕️",color:"#e8e8e8"},dialogue:"It spreads when they gather. We must close markets, burn linens. Or pray it passes, as the council suggests.",context:"Plague outbreak in capital. Decision urgent.",choices:[{id:"A",label:"Quarantine",desc:"Lock districts",icon:"\uD83D\uDEA7",effects:{happiness:-20,gold:-20,fear:10,reputation:15},twist:"Unpopular, saves lives. History will judge kindly.",flavor:"Science over popularity."},{id:"B",label:"Festival to Boost Morale",desc:"Ignore it with music",icon:"\uD83C\uDFB6",effects:{happiness:10,gold:-15,army:-20,fear:-5},twist:"Morale up! Also infection rate up. Oops.",flavor:"Nero approved."},{id:"C",label:"Pay Healers",desc:"Fund infirmaries",icon:"\uD83C\uDFE5",effects:{gold:-35,happiness:15,loyalty:15,reputation:10},twist:"Althea becomes saint-like in your court.",flavor:"Compassion is costly."},{id:"D",label:"Blame Outsiders",desc:"Close borders",icon:"\uD83E\uDDF1",effects:{fear:25,reputation:-20,happiness:-5},twist:"Rally effect short-term, shame long-term.",flavor:"Oldest trick."}]},{id:8,title:"Harvest Moon Debacle",character:{name:"Jester Pipp",role:"Master of Revels",emoji:"\uD83C\uDCCF",color:"#ff6b35"},dialogue:"The people want a week of wine and pigs on spits! The treasury says... maybe half a pig and watered wine?",context:"Festival vs saving gold. Happiness of realm at stake.",choices:[{id:"A",label:"Full Festival",desc:"Pigs for all!",icon:"\uD83C\uDF89",effects:{happiness:30,gold:-40,loyalty:10},twist:"Best party in 20 years. Treasury cries.",flavor:"Bread and circuses, heavy on circus."},{id:"B",label:"Modest Feast",desc:"One day, sensible",icon:"\uD83C\uDF7A",effects:{happiness:10,gold:-15},twist:"Fine. Not memorable. Safe.",flavor:"Middle path."},{id:"C",label:"Cancel, Save Gold",desc:"Gold > fun",icon:"\uD83C\uDFE6",effects:{gold:20,happiness:-25,loyalty:-10},twist:"People remember you cancelled fun. Forever.",flavor:"Scrooge, crowned."},{id:"D",label:"Tax Festival",desc:"Pay to party",icon:"\uD83C\uDF9F️",effects:{gold:15,happiness:-10,fear:10},twist:"Rich party, poor watch. Classy.",flavor:"Pay-to-have-fun."}]},{id:9,title:"The Ashen Woman",character:{name:"Inquisitor Rook",role:"Town Accuser",emoji:"\uD83D\uDD25",color:"#1a1a1a"},dialogue:"Old Yara talks to crows, heals with weeds. Witch! The mob has torches, Sire. What say you?",context:"Witch accusation. Fear vs reason.",choices:[{id:"A",label:"Trial by Water",desc:"Medieval justice",icon:"\uD83C\uDF0A",effects:{fear:20,happiness:-10,reputation:-15},twist:"She floats! Witch! Or... wood? Science unclear.",flavor:"Justice,-ish."},{id:"B",label:"Protect Her",desc:"She's a herbalist",icon:"\uD83C\uDF3F",effects:{happiness:15,loyalty:-10,reputation:15,fear:-10},twist:"She cures captain's gout. Captain now pro-herb.",flavor:"Rational monarch."},{id:"C",label:"Exile Quietly",desc:"Avoid mob",icon:"\uD83D\uDEB6",effects:{fear:5,happiness:-5,reputation:5},twist:"She leaves, curses mildly. Your cabbages die. Coincidence?",flavor:"Compromise."},{id:"D",label:"Make Her Court Mage",desc:"Lean in",icon:"\uD83E\uDDD9",effects:{fear:15,happiness:10,reputation:-5,gold:-10},twist:"Court loves magic shows. Fear and awe.",flavor:"Hire the problem."}]},{id:10,title:"River's Wrath",character:{name:"Two Mayors",role:"Upstream & Downstream",emoji:"\uD83C\uDF0A",color:"#2a6a8a"},dialogue:"UP: We dam to save our crops! DOWN: You flood our children! Pick, King, before we pick for you!",context:"Dam dispute between two states. Both banners in court.",choices:[{id:"A",label:"Break Dam",desc:"Downstream lives",icon:"\uD83D\uDD28",effects:{happiness:10,loyalty:-10,reputation:5},twist:"Upstream mayor storms out. Downstream throws flowers.",flavor:"Water finds a way."},{id:"B",label:"Keep Dam",desc:"Upstream loyalty",icon:"\uD83E\uDDF1",effects:{gold:15,happiness:-15,loyalty:10},twist:"More grain, but downstream famine. Hmm.",flavor:"One side fed."},{id:"C",label:"Crown Aqueduct",desc:"Engineer solution",icon:"\uD83C\uDFD7️",effects:{gold:-35,happiness:20,reputation:20,loyalty:10},twist:"Expensive, brilliant. Both sides grudgingly impressed.",flavor:"Infrastruct-king."},{id:"D",label:"Let Them Duel",desc:"Trial by combat, but wet",icon:"\uD83E\uDD3A",effects:{happiness:5,fear:10,reputation:-5},twist:"They duel in mud. Entertaining, unresolved.",flavor:"Reality TV, 1200s."}]},{id:11,title:"Night Howls",character:{name:"Beastmaster Kael",role:"Animal Rider Corps",emoji:"\uD83D\uDC3A",color:"#4a3a2a"},dialogue:"Wolves with amber eyes, Sire. Bigger than horses. My riders can hunt them, but need silvered weapons.",context:"Animal attacks from deep PJ forests. Connects to Trade Route game.",choices:[{id:"A",label:"Fund Riders",desc:"Silver lances",icon:"\uD83D\uDC3E",effects:{gold:-20,army:15,happiness:15,fear:-10},twist:"Riders become legends. Children want toy wolves.",flavor:"Your animal corps shines."},{id:"B",label:"Bounty System",desc:"Pay per pelt",icon:"\uD83D\uDC80",effects:{gold:-10,happiness:5,fear:5},twist:"Peasants hunt, bring you... many stray dogs.",flavor:"Oops, all dogs."},{id:"C",label:"Wall the Village",desc:"Hide behind stone",icon:"\uD83E\uDDF1",effects:{gold:-25,fear:15,happiness:-10},twist:"Safe but feels like prison. Wolves wait.",flavor:"Turtle strategy."},{id:"D",label:"Tame Them",desc:"Make them royal guard",icon:"\uD83E\uDD81",effects:{army:25,fear:25,happiness:-5,reputation:10},twist:"You now have wolf guards. Terrifying, effective, hungry.",flavor:"Beast King!"}]},{id:12,title:"Shadow in Silk",character:{name:"Guard-Captain",role:"Royal Interrogator",emoji:"\uD83D\uDDE1️",color:"#2c2c2c"},dialogue:"Caught with ciphers and poison ring. Spy from Varnholt. Says he sells spices. Spices don't need invisible ink.",context:"Enemy spy. Execute, turn, or trade?",choices:[{id:"A",label:"Execute Publicly",desc:"Message to enemies",icon:"\uD83E\uDE93",effects:{fear:20,reputation:-10,loyalty:10,army:5},twist:"Varnholt sends formal complaint. And another spy.",flavor:"Fear as foreign policy."},{id:"B",label:"Turn Him",desc:"Double agent",icon:"\uD83D\uDD75️",effects:{gold:10,reputation:15,fear:-5,army:10},twist:"He feeds Varnholt bad info. You learn their tax rates!",flavor:"Spy vs spy."},{id:"C",label:"Ransom",desc:"Gold for his head",icon:"\uD83D\uDCBC",effects:{gold:30,reputation:5,loyalty:-5},twist:"Paid! Varnholt now thinks you're cheap.",flavor:"Mercenary monarch."},{id:"D",label:"Release + Note",desc:"'We know. Be better.'",icon:"✉️",effects:{reputation:20,fear:-15,happiness:5},twist:"Legendary flex. Bards sing about it.",flavor:"Big king energy."}]},{id:13,title:"Deep Dark",character:{name:"Foreman Durg",role:"Mine Chief",emoji:"⛏️",color:"#555"},dialogue:"Timber cracked, twelve men still below. We can dig now, lose gold, or seal it and... declare them martyrs.",context:"Gold mine collapse. Lives vs economy.",choices:[{id:"A",label:"Dig Immediately",desc:"Every man out",icon:"\uD83E\uDEF6",effects:{gold:-30,happiness:20,loyalty:20,army:-5},twist:"Nine saved. Two lost. You attend funeral.",flavor:"King who digs."},{id:"B",label:"Seal & Compensate",desc:"Gold to families",icon:"⚰️",effects:{gold:-20,happiness:-15,loyalty:-10,fear:10},twist:"Efficient, cold. Families buy new houses, not trust.",flavor:"Corporate king."},{id:"C",label:"Prisoners to Dig",desc:"Risk them instead",icon:"⛓️",effects:{gold:-5,happiness:-20,army:10,fear:15},twist:"Mine cleared, but whispers about ethics.",flavor:"Machiavellian."},{id:"D",label:"Pray, Then Dig",desc:"Both, with delay",icon:"\uD83D\uDD6F️",effects:{gold:-15,happiness:-5,loyalty:5,reputation:5},twist:"One more lost due to delay. Priests say gods willed.",flavor:"Thoughts, prayers, then shovels."}]},{id:14,title:"We Want Voices!",character:{name:"Scholar Loom",role:"People's Scribe",emoji:"\uD83D\uDCDC",color:"#c9a84c"},dialogue:"Why should 20 banners decide for thousands? Let the people have a council! Or at least a suggestion box?",context:"People demand democracy. Unprecedented.",choices:[{id:"A",label:"Grant Council",desc:"People's assembly",icon:"\uD83C\uDFDB️",effects:{happiness:30,loyalty:-15,reputation:20,fear:-20},twist:"They debate for 3 days about turnip prices. Democracy!",flavor:"Power shared."},{id:"B",label:"Crush Talk",desc:"No councils",icon:"\uD83D\uDC4A",effects:{fear:25,happiness:-25,loyalty:10,reputation:-15},twist:"Silence falls. Also hope.",flavor:"Absolute monarch."},{id:"C",label:"Suggestion Box",desc:"Fake democracy",icon:"\uD83D\uDCE5",effects:{happiness:5,gold:-5,reputation:-5},twist:"Box fills with... very creative insults about you.",flavor:"You read them at night."},{id:"D",label:"You Join Them",desc:"King in assembly",icon:"\uD83D\uDC51",effects:{happiness:20,loyalty:15,fear:-10,reputation:15},twist:"You sit with them. They are awkward, then charmed.",flavor:"King of the people."}]},{id:15,title:"The Prince's Hunt",character:{name:"Prince Alden",role:"Your Son",emoji:"\uD83E\uDD34",color:"#d4a017"},dialogue:"Father, the white stag in Blackwood! One shot and bards will sing of Alden for centuries! Let me go, with just a few men?",context:"Heir wants dangerous hunt. Pride vs protection.",choices:[{id:"A",label:"Go, Son!",desc:"Let him prove",icon:"\uD83E\uDD8C",effects:{loyalty:10,reputation:10,army:-10,fear:-5},twist:"He returns with stag AND sprained ankle. Bards sing anyway.",flavor:"Proud dad."},{id:"B",label:"Full Escort",desc:"50 guards",icon:"\uD83D\uDEE1️",effects:{gold:-20,army:5,happiness:5,loyalty:5},twist:"Stag flees from clanking army. Prince annoyed.",flavor:"Helicopter parenting, medieval."},{id:"C",label:"Forbid Hunt",desc:"Too risky",icon:"\uD83D\uDEAB",effects:{loyalty:-10,happiness:-5,fear:5},twist:"Prince sulks, writes angsty poetry.",flavor:"Safe, unloved."},{id:"D",label:"You Both Go",desc:"Father-son hunt",icon:"\uD83C\uDFF9",effects:{happiness:15,loyalty:15,gold:-10,reputation:15},twist:"No stag, but best day in years. Guards fake seeing stag to make you happy.",flavor:"Wholesome."}]},{id:16,title:"God's Calendar",character:{name:"High Priest & Imam",role:"Faith Leaders",emoji:"⛪",color:"#f5e6c8"},dialogue:"Our holy day is same day! Both claim square! Your grandfather promised us both! Solve it, or heavens fight!",context:"Religious festival conflict. Tolerance test.",choices:[{id:"A",label:"Split The Day",desc:"Morning / Evening",icon:"☀️",effects:{happiness:15,reputation:15,loyalty:5},twist:"Both celebrate, share food. Accidental unity.",flavor:"Solomon again."},{id:"B",label:"Crown Festival",desc:"Neither, king's day!",icon:"\uD83D\uDC51",effects:{fear:15,happiness:-15,gold:10},twist:"Bold! Both faiths annoyed at you, not each other.",flavor:"Ego, but effective."},{id:"C",label:"Debate Contest",desc:"Theologians duel",icon:"\uD83D\uDCD6",effects:{happiness:10,reputation:5,fear:-5},twist:"Three hours, no winner, everyone hungry. They agree to share.",flavor:"Nerd fight."},{id:"D",label:"Pick Older Faith",desc:"Tradition",icon:"⏳",effects:{loyalty:10,happiness:-10,reputation:-10,fear:10},twist:"Older faith smug, newer faith plotting.",flavor:"History buff king."}]},{id:17,title:"Blood on Silk",character:{name:"Caravan Master",role:"Trade Route Survivor",emoji:"\uD83D\uDC2B",color:"#c9a84c"},dialogue:"Bandits! Took our silk, killed Joren. Your animal riders were patrolling... the other road. Brilliant.",context:"Bandits on trade route. Your caravan system failing.",choices:[{id:"A",label:"Hunt Bandits",desc:"Send riders now",icon:"\uD83D\uDC0E",effects:{army:15,gold:-15,reputation:15,happiness:10},twist:"Bandits caught! One was former tax collector. Awkward.",flavor:"Justice."},{id:"B",label:"Pay Protection",desc:"Gold to bandits",icon:"\uD83E\uDD1D",effects:{gold:-20,happiness:-10,fear:15},twist:"They take gold, raid again next month. Shock.",flavor:"Extortion subscription."},{id:"C",label:"Arm Merchants",desc:"Let them fight",icon:"⚔️",effects:{army:-5,gold:10,happiness:5,fear:10},twist:"Merchants now warlords. Trade up, stability down.",flavor:"Libertarian caravan."},{id:"D",label:"Build Fort",desc:"Permanent post",icon:"\uD83C\uDFF0",effects:{gold:-35,army:20,reputation:10,loyalty:10},twist:"Costly, but route becomes safest in PJ Land.",flavor:"Infrastructure king returns."}]},{id:18,title:"Cracked Earth",character:{name:"Water-Keeper",role:"Drought Herald",emoji:"\uD83D\uDCA7",color:"#a0c4e3"},dialogue:"Wells are dust, Sire. River is thread. Farmers and city both thirst. Who drinks?",context:"Drought - water rationing dilemma.",choices:[{id:"A",label:"City First",desc:"Keep capital alive",icon:"\uD83C\uDFD9️",effects:{happiness:-15,loyalty:15,gold:10,fear:10},twist:"City survives, farms wither. Bread price triples.",flavor:"Urban king."},{id:"B",label:"Fa
