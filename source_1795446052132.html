  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root {
  --bg: #0e0a08;
  --surface: #1a1510;
  --surface-2: #241e17;
  --surface-3: #2f2720;
  --gold: #f2c94c;
  --gold-2: #ffb700;
  --gold-glow: rgba(242,201,76,0.35);
  --blood: #e63946;
  --stone: #c2b8a3;
  --stone-dim: #8c8478;
  --emerald: #2ecc71;
  --sky: #ff8c42;
  --ink: #f5efe6;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--surface-3) transparent;
}

body {
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Cinzel', serif;
  overflow: hidden;
  overscroll-behavior: none;
}

.mono {
  font-family: 'JetBrains Mono', monospace;
}

.gold-text {
  background: linear-gradient(180deg, #fff6c2 0%, #f2c94c 40%, #ffb700 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.castle-title {
  font-family: 'Cinzel Decorative', serif;
  letter-spacing: 0.06em;
}

/* hide scrollbars for game */

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-thumb {
  background: var(--surface-3);
  border-radius: 10px;
}

button {
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.hover\:scale-\[1\.02\]:hover {
  --tw-scale-x: 1.02;
  --tw-scale-y: 1.02;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:border-\[\#f2c94c\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(242 201 76 / var(--tw-border-opacity, 1));
}

.hover\:border-\[\#f2c94c\]\/50:hover {
  border-color: rgb(242 201 76 / 0.5);
}

.hover\:bg-\[\#f2c94c\]\/10:hover {
  background-color: rgb(242 201 76 / 0.1);
}

@media (min-width: 640px) {
  .sm\:left-3 {
    left: 0.75rem;
  }

  .sm\:right-3 {
    right: 0.75rem;
  }

  .sm\:top-\[86px\] {
    top: 86px;
  }

  .sm\:block {
    display: block;
  }

  .sm\:inline {
    display: inline;
  }

  .sm\:h-8 {
    height: 2rem;
  }

  .sm\:w-8 {
    width: 2rem;
  }

  .sm\:w-\[110px\] {
    width: 110px;
  }

  .sm\:w-\[118px\] {
    width: 118px;
  }

  .sm\:w-\[210px\] {
    width: 210px;
  }

  .sm\:w-\[240px\] {
    width: 240px;
  }

  .sm\:gap-2 {
    gap: 0.5rem;
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:p-10 {
    padding: 2.5rem;
  }

  .sm\:p-2\.5 {
    padding: 0.625rem;
  }

  .sm\:p-3 {
    padding: 0.75rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-\[10px\] {
    font-size: 10px;
  }

  .sm\:text-\[11px\] {
    font-size: 11px;
  }

  .sm\:text-\[12px\] {
    font-size: 12px;
  }

  .sm\:text-\[13px\] {
    font-size: 13px;
  }

  .sm\:text-\[15px\] {
    font-size: 15px;
  }

  .sm\:text-\[52px\] {
    font-size: 52px;
  }
}
